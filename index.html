<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suleste</title>
<meta name="theme-color" content="#0E2F5A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suleste">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #0E2F5A; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #carregando { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #carregando img { width: 96px; height: 96px; border-radius: 20px; }
</style>
</head>
<body>
<!-- Casca do app: só mostra o ícone e abre o app do Google em tela cheia. Nenhum dado fica aqui. -->
<div id="carregando"><img src="icone-192.png" alt="Suleste"></div>
<iframe src="https://script.google.com/macros/s/AKfycby0SHvf6IXPjw6ed2yax4K8-C5BPhnNkh0vhmGrW_M4kPlkqvr6k0fiH3hvXUJ952DuiA/exec" title="Suleste" allow="camera; clipboard-write"
        onload="document.getElementById('carregando').remove()"></iframe>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
